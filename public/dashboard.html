<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group App - Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/parse@5.3.0/dist/parse.min.js"></script>
</head>
<body>
  <h1>Dashboard</h1>
  <p id="welcome"></p>
  <button onclick="logOut()">Log out</button>

  <script>
    Parse.initialize("B5HnjwByfcseN4kxNM6NA3PM5GkXntYwQffvySB7", "Pq1xqKOwlaEMC4YIZfSVrrAk9JATzVC3zYptls4D");
    Parse.serverURL = "https://parseapi.back4app.com";

    const me = Parse.User.current();
    if (!me) location.href = "index.html";   // not logged in -> sent back
    else document.getElementById("welcome").textContent = "Welcome, " + me.get("username") + "! Only logged-in users see this.";

    async function logOut() { await Parse.User.logOut(); location.href = "index.html"; }
  </script>
</body>
</html>
